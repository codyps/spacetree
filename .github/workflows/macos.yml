name: macOS build

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      SPARKLE_PRIVATE_ED_KEY:
        required: false
    outputs:
      display_version:
        value: ${{ jobs.package.outputs.display_version }}
      sha:
        value: ${{ jobs.package.outputs.sha }}
    inputs:
      development:
        description: Include Git identity in the installer version
        type: boolean
        default: false
      ref:
        description: Exact commit to test and package
        required: true
        type: string
      release_tag:
        description: Expected version tag for release packaging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ inputs.ref || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

jobs:
  test:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/check-version.py
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test Swift app
        # GitHub's macOS runner fleet intermittently kills the swift-testing
        # helper with an unreported SIGILL/SIGTRAP; confirmed on 2026-09-25
        # against unchanged, historically green commits. Genuine test
        # failures reproduce on every attempt, so retry to ride out faults.
        run: |
          status=0
          for attempt in 1 2 3; do
            swift test --configuration release && exit 0
            status=$?
            echo "Swift tests failed on attempt $attempt (exit $status); retrying."
            sleep 10
          done
          exit $status
      - name: Test backup report tool
        run: python3 -m unittest discover -s scripts/time-machine -p 'test_*.py'
      - name: Test release version checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  package:
    name: Universal DMG
    needs: test
    runs-on: macos-26
    timeout-minutes: 25
    outputs:
      display_version: ${{ steps.version.outputs.display_version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Derive installer version
        id: version
        env:
          DEVELOPMENT_BUILD: ${{ inputs.development }}
        run: |
          args=()
          if [[ "$DEVELOPMENT_BUILD" == true ]]; then
            args+=(--development)
          fi
          printf 'display_version=%s\n' "$(python3 scripts/build-version.py "${args[@]}")" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/check-version.py
      - name: Build and verify DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          DISPLAY_VERSION: ${{ steps.version.outputs.display_version }}
          SPARKLE_PUBLIC_ED_KEY: ${{ (inputs.development || inputs.release_tag != '') && vars.SPARKLE_PUBLIC_ED_KEY || '' }}
          SPARKLE_PRIVATE_ED_KEY: ${{ (inputs.development || inputs.release_tag != '') && secrets.SPARKLE_PRIVATE_ED_KEY || '' }}
        run: |
          if [[ -n "$SPARKLE_PUBLIC_ED_KEY" && -z "$SPARKLE_PRIVATE_ED_KEY" ]] ||
             [[ -z "$SPARKLE_PUBLIC_ED_KEY" && -n "$SPARKLE_PRIVATE_ED_KEY" ]]; then
            echo 'Configure both Sparkle keys, or neither, for release builds.' >&2
            exit 1
          fi
          scripts/build-dmg.sh
      - name: Upload installer and checksum
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SpaceTree-universal-dmg
          path: |
            dist/SpaceTree-*-universal.dmg
            dist/SpaceTree-*-universal.dmg.sha256
            dist/appcast.xml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
