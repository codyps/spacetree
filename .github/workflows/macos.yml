name: macOS build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to test and package
        required: true
        type: string
      release_tag:
        description: Expected version tag for release packaging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  test:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/check-version.py
      - name: Show toolchain
        run: swift --version
      - name: Test Swift app
        run: swift test --configuration release
      - name: Test backup report tool
        run: python3 -m unittest discover -s scripts/time-machine -p 'test_*.py'
      - name: Test release version checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  package:
    name: Universal DMG
    needs: test
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/check-version.py
      - name: Build and verify DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-dmg.sh
      - name: Upload installer and checksum
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SpaceTree-universal-dmg
          path: |
            dist/SpaceTree-*-universal.dmg
            dist/SpaceTree-*-universal.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
