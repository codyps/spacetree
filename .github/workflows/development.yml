name: Development

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Build every pushed commit. Only publication is serialized; older commits
# check the current main head before changing the rolling release.
concurrency:
  group: development-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/macos.yml
    secrets:
      SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
    with:
      ref: ${{ github.sha }}
      release_tag: ''
      development: true
    permissions:
      contents: read

  publish:
    name: Update development release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: spacetreedevelopment-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SpaceTree-universal-dmg
          path: dist
      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ needs.build.outputs.sha }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DISPLAY_VERSION: ${{ needs.build.outputs.display_version }}
        working-directory: dist
        run: ../scripts/publish-development.sh
